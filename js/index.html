<div id="auth-screen" style="display:none;position:fixed;inset:0;z-index:99999;background:radial-gradient(ellipse at 50% 30%,#0a1832,#020510 70%);color:#e6eefc;font-family:system-ui,Arial,sans-serif;align-items:center;justify-content:center">

<!-- STELLARION MOBILE R1 — moteur mobile INLINE : scène uniforme + compaction + barre d'onglets.
     Intégré dans index.html volontairement : aucun fichier externe, aucun cache possible. -->
<script>
(function () {
  "use strict";
  if (window.__stellarionMobileR1) return;
  window.__stellarionMobileR1 = true;
  // Neutralise les anciens patchs mobiles s'ils traînent encore en cache :
  window.__stellarionMobileSafe1643 = true;
  window.__stellarionStage1645 = true;
  window.__stellarionUniformScale1644 = true;

  var DWL = 932, DHL = 430;   // scène paysage
  var DWP = 430, DHP = 932;   // scène portrait

  function phone() {
    return /iphone|ipad|ipod|android/i.test(navigator.userAgent || "") ||
      matchMedia("(pointer:coarse)").matches ||
      Math.min(screen.width, screen.height) <= 900;
  }
  function vw() { return (window.visualViewport && visualViewport.width) || innerWidth; }
  function vh() { return (window.visualViewport && visualViewport.height) || innerHeight; }
  function isPortrait() { return vh() >= vw(); }
  function authVisible() {
    var a = document.getElementById("auth-screen");
    if (!a) return false;
    var cs = getComputedStyle(a);
    return cs.display !== "none" && cs.visibility !== "hidden" && cs.opacity !== "0";
  }

  var meta = null;
  function ensureViewport() {
    if (!meta || !meta.isConnected) {
      meta = document.querySelector("meta[name='viewport']");
      if (!meta) { meta = document.createElement("meta"); meta.name = "viewport"; document.head.appendChild(meta); }
    }
    var want = phone()
      ? "width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
      : "width=device-width, initial-scale=1.0, viewport-fit=cover";
    if (meta.getAttribute("content") !== want) meta.setAttribute("content", want);
  }

  function injectCss() {
    if (document.getElementById("st-r1-css")) return;
    var s = document.createElement("style");
    s.id = "st-r1-css";
    s.textContent = "\n" +
"html.stR1{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#020510!important}\n" +
"html.stR1 body{position:absolute!important;left:0!important;top:0!important;margin:0!important;padding:0!important;width:var(--r1dw,932px)!important;height:var(--r1dh,430px)!important;min-width:0!important;max-width:none!important;overflow:hidden!important;transform-origin:0 0!important;transform:translate(var(--r1ox,0px),var(--r1oy,0px)) scale(var(--r1k,1))!important;background:#020510!important}\n" +
"html.stR1 body input,html.stR1 body textarea,html.stR1 body select,html.stR1 body button{font-size:16px!important}\n" +
"/* --- Connexion : le jeu disparait totalement derriere --- */\n" +
"html.stR1 body.stR1auth #app,html.stR1 body.stR1auth .topbar,html.stR1 body.stR1auth .carousel-container,html.stR1 body.stR1auth .stable-resourcebar1542b,html.stR1 body.stR1auth .layout,html.stR1 body.stR1auth #st-r1-nav,html.stR1 body.stR1auth #st-r1-badge{display:none!important}\n" +
"html.stR1 body #auth-screen{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-height:100%!important;max-width:100%!important;overflow:auto!important;padding:14px!important;box-sizing:border-box!important;align-items:center!important;justify-content:center!important}\n" +
"html.stR1 body #auth-screen>div{width:min(420px,92%)!important;max-width:92%!important;margin:auto!important;padding:0!important}\n" +
"/* --- Topbar compacte --- */\n" +
"html.stR1 body .topbar{width:100%!important;max-width:100%!important;height:40px!important;min-height:40px!important;padding:3px 8px!important;display:flex!important;align-items:center!important;gap:6px!important;overflow-x:auto!important;overflow-y:hidden!important;scrollbar-width:none!important}\n" +
"html.stR1 body .topbar::-webkit-scrollbar{display:none!important}\n" +
"html.stR1 body .brand{font-size:16px!important;letter-spacing:3px!important;white-space:nowrap!important}\n" +
"/* --- Carrousel remplace par la barre d'onglets du bas --- */\n" +
"html.stR1 body .carousel-container{display:none!important}\n" +
"/* --- Barre ressources : une ligne scrollable --- */\n" +
"html.stR1 body .stable-resourcebar1542b{width:100%!important;max-width:100%!important;margin:0!important;padding:3px 8px!important;border-radius:0!important;border-left:0!important;border-right:0!important;overflow:hidden!important;box-sizing:border-box!important}\n" +
"html.stR1 body .stable-resource-list1542b{display:flex!important;flex-wrap:nowrap!important;gap:6px!important;overflow-x:auto!important;overflow-y:hidden!important;scrollbar-width:none!important}\n" +
"html.stR1 body .stable-resource-list1542b::-webkit-scrollbar{display:none!important}\n" +
"html.stR1 body .stable-res1542b{flex:0 0 106px!important;min-width:106px!important;max-width:106px!important;min-height:40px!important;padding:4px 6px!important;display:grid!important;grid-template-columns:22px minmax(0,1fr)!important;gap:5px!important;align-items:center!important;box-sizing:border-box!important}\n" +
"html.stR1 body .stable-res-ico1542b{font-size:17px!important}\n" +
"html.stR1 body .stable-res1542b small{font-size:9px!important;line-height:1!important;white-space:nowrap!important}\n" +
"html.stR1 body .stable-res1542b strong{font-size:13px!important;line-height:1!important;white-space:nowrap!important}\n" +
"html.stR1 body .stable-clock1542b{display:none!important}\n" +
"html.stR1 body .fragment-shop-entry1546{max-width:120px!important;height:22px!important;min-height:22px!important;line-height:22px!important;font-size:10px!important;padding:0 8px!important;margin:0!important}\n" +
"/* --- Layout : une seule colonne pleine largeur --- */\n" +
"html.stR1 body .layout,html.stR1 body .layout.has-bottom-queue{display:block!important;grid-template-columns:none!important;width:100%!important;max-width:100%!important;height:calc(100% - 140px)!important;min-height:0!important;overflow:hidden!important;margin:0!important;padding:0!important}\n" +
"html.stR1 body .layout>.side,html.stR1 body .layout>.side.left,html.stR1 body .layout>.side.right{display:none!important}\n" +
"html.stR1 body #center{display:block!important;width:100%!important;max-width:100%!important;height:100%!important;overflow:auto!important;-webkit-overflow-scrolling:touch!important;box-sizing:border-box!important}\n" +
"html.stR1 body .gwm-stage{width:100%!important;max-width:100%!important;height:100%!important;min-height:0!important;overflow:hidden!important}\n" +
"html.stR1 body .card,html.stR1 body .panel{max-width:100%!important;box-sizing:border-box!important}\n" +
"/* --- Barre d'onglets bas facon appli --- */\n" +
"html.stR1 body #st-r1-nav{position:absolute!important;left:0!important;right:0!important;bottom:0!important;height:50px!important;display:flex!important;gap:6px!important;align-items:center!important;padding:6px 8px!important;box-sizing:border-box!important;background:linear-gradient(180deg,rgba(5,13,26,.92),#020510)!important;border-top:1px solid rgba(79,195,247,.28)!important;overflow-x:auto!important;overflow-y:hidden!important;z-index:600!important;scrollbar-width:none!important}\n" +
"html.stR1 body #st-r1-nav::-webkit-scrollbar{display:none!important}\n" +
"html.stR1 body #st-r1-nav button{flex:0 0 auto!important;height:38px!important;padding:0 13px!important;border-radius:11px!important;border:1px solid rgba(79,195,247,.28)!important;background:rgba(10,24,46,.9)!important;color:#cfe3fb!important;font:700 12px system-ui,Arial!important;white-space:nowrap!important;cursor:pointer}\n" +
"html.stR1 body #st-r1-nav button.on{background:#4FC3F7!important;color:#04162e!important;border-color:#4FC3F7!important}\n" +
"/* --- Temoin de chargement --- */\n" +
"html.stR1 body #st-r1-badge{position:absolute!important;right:8px!important;bottom:58px!important;z-index:601!important;background:#19e68c!important;color:#00140b!important;border:2px solid #fff!important;border-radius:999px!important;padding:6px 9px!important;font:900 10px/1 system-ui,Arial!important;pointer-events:none!important}\n" +
"/* --- Nettoyage des anciens overlays/patchs sur mobile --- */\n" +
"html.stR1 body #stellarion-rotate1626,html.stR1 body #stellarion-scrollrail1628,html.stR1 body #stellarion-rotate-overlay-1641{display:none!important}\n" +
"html.stR1 body .bpop1632{width:min(460px,calc(100% - 20px))!important;max-height:calc(100% - 70px)!important}\n";
    document.head.appendChild(s);
  }

  /* --- Scene a resolution fixe + echelle --- */
  function fit() {
    ensureViewport();
    var r = document.documentElement;
    if (!phone()) { r.classList.remove("stR1"); return; }
    injectCss();
    var p = isPortrait();
    var dw = p ? DWP : DWL, dh = p ? DHP : DHL;
    var k = Math.min(vw() / dw, vh() / dh);
    r.style.setProperty("--r1dw", dw + "px");
    r.style.setProperty("--r1dh", dh + "px");
    r.style.setProperty("--r1k", String(k));
    r.style.setProperty("--r1ox", Math.max(0, (vw() - dw * k) / 2).toFixed(2) + "px");
    r.style.setProperty("--r1oy", Math.max(0, (vh() - dh * k) / 2).toFixed(2) + "px");
    r.classList.add("stR1");
    if (document.body) document.body.classList.toggle("stR1auth", authVisible());
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  /* --- Barre d'onglets : miroir des pages du carrousel --- */
  function buildNav() {
    if (!phone() || !document.body) return;
    var nav = document.getElementById("st-r1-nav");
    if (!nav) {
      nav = document.createElement("div");
      nav.id = "st-r1-nav";
      document.body.appendChild(nav);
    }
    var pages = document.querySelectorAll(".carousel-page");
    if (!pages.length) { nav.style.display = "none"; return; }
    nav.style.display = "";
    var sig = Array.prototype.map.call(pages, function (p) {
      return p.textContent.trim() + (/active|current|selected/i.test(p.className) ? "*" : "");
    }).join("|");
    if (nav.__sig === sig) return;
    nav.__sig = sig;
    nav.innerHTML = "";
    Array.prototype.forEach.call(pages, function (p, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = p.textContent.trim() || ("Page " + (i + 1));
      if (/active|current|selected/i.test(p.className)) b.className = "on";
      b.addEventListener("click", function () {
        var list = document.querySelectorAll(".carousel-page");
        if (list[i]) list[i].click();
      });
      nav.appendChild(b);
    });
  }

  function badge() {
    if (!phone() || !document.body) return;
    if (document.getElementById("st-r1-badge")) return;
    var b = document.createElement("div");
    b.id = "st-r1-badge";
    b.textContent = "MOBILE R1 OK";
    document.body.appendChild(b);
  }

  function apply() { fit(); buildNav(); badge(); }

  apply();
  document.addEventListener("DOMContentLoaded", apply);
  window.addEventListener("load", apply);
  window.addEventListener("resize", function () { setTimeout(apply, 60); }, { passive: true });
  window.addEventListener("orientationchange", function () { setTimeout(apply, 220); }, { passive: true });
  if (window.visualViewport) {
    try { visualViewport.addEventListener("resize", function () { setTimeout(fit, 60); }); } catch (e) {}
  }
  try { new MutationObserver(function () { apply(); }).observe(document.documentElement, { childList: true, subtree: true }); } catch (e) {}
  setInterval(apply, 700);

  window.stellarionMobileR1Audit = function () {
    var cs = getComputedStyle(document.documentElement);
    return {
      patch: "mobile-R1-inline",
      actif: document.documentElement.classList.contains("stR1"),
      phone: phone(),
      portrait: isPortrait(),
      design: cs.getPropertyValue("--r1dw").trim() + " x " + cs.getPropertyValue("--r1dh").trim(),
      echelle: cs.getPropertyValue("--r1k").trim(),
      ecranReel: vw() + " x " + vh(),
      ongletsNav: document.querySelectorAll("#st-r1-nav button").length,
      authVisible: authVisible()
    };
  };
})();
</script>
