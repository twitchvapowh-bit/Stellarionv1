  function measureTop() {
    // Topbar et ressources sont des overlays : elles ne consomment plus d'espace.
    document.documentElement.style.setProperty("--r2top", "0px");
  }

  function menuButton() {
    if (!document.body) return;
    if (!document.getElementById("st-r2-menu-back")) {
      var back = document.createElement("div");
      back.id = "st-r2-menu-back";
      back.addEventListener("click", function () {
        document.body.classList.remove("stR2menu");
      });
      document.body.appendChild(back);
    }
    if (document.getElementById("st-r2-menu")) return;
    var b = document.createElement("button");
    b.id = "st-r2-menu";
    b.type = "button";
    b.title = "Menu (reglages, messages, ressources)";
    b.innerHTML = "\u2630 Menu<span class=\"r2-menu-badge\" id=\"st-r2-menu-badge\" style=\"display:none\"></span>";
    b.addEventListener("click", function () {
      document.body.classList.toggle("stR2menu");
    });
    document.body.appendChild(b);
  }

  function updateMenuBadge() {
    var el = document.getElementById("st-r2-menu-badge");
    if (!el) return;
    var n = 0;
    try { if (typeof window.unreadCount === "function") n = window.unreadCount() || 0; } catch (e) {}
    if (n > 0) { el.textContent = n; el.style.display = "inline-flex"; }
    else { el.style.display = "none"; }
  }

  /* Chasseur de pastilles fantomes ("Planetes figees / hover actif") :
     suppression par TEXTE, quelle que soit la classe reelle de l'element. */
  var GHOST_RE = /plan[eè]tes fig[eé]es|hover actif/i;
  function killGhosts() {
    var spans = document.querySelectorAll("span:not([data-r2ghost]),small:not([data-r2ghost]),div:not([data-r2ghost])");
    for (var i = 0; i < spans.length; i++) {
      var el = spans[i];
      if (el.tagName === "DIV" && el.childElementCount > 0) { el.setAttribute("data-r2ghost", "1"); continue; }
      var t = el.textContent || "";
      if (t.length < 60 && GHOST_RE.test(t)) {
        var box = el.closest("div") || el;
        box.style.setProperty("display", "none", "important");
        box.setAttribute("data-r2ghost", "1");
      }
      el.setAttribute("data-r2ghost", "1");
    }
  }

  function ensurePop() {
    if (!document.body) return null;
    var back = document.getElementById("st-r2-pop-back");
    if (!back) {
      back = document.createElement("div");
      back.id = "st-r2-pop-back";
      back.addEventListener("click", closePop);
      document.body.appendChild(back);
    }
    var pop = document.getElementById("st-r2-pop");
    if (!pop) {
      pop = document.createElement("div");
      pop.id = "st-r2-pop";
      document.body.appendChild(pop);
    }
    return pop;
  }
  function openPop() { if (document.body) document.body.classList.add("stR2pop"); }
  function closePop() { if (document.body) document.body.classList.remove("stR2pop"); }
  window.stellarionClosePopR2 = closePop;

  /* Le pop-up adopte un panneau du jeu selon le contexte :
     - carte galaxie -> colonne droite (.side.right) : detail planete + missions
     - chantier      -> .arsenal-detail : panneau de construction du vaisseau
     Le jeu re-rend ces panneaux a chaque render : on re-adopte la version
     fraiche en continu, comme pour le carrousel. */
  var popSource = ".layout>.side.right, .side.right";
  function adoptRightSide() {
    var pop = ensurePop();
    if (!pop) return;
    var els = document.querySelectorAll(popSource);
    var fresh = null;
    for (var i = 0; i < els.length; i++) {
      if (!pop.contains(els[i])) fresh = els[i];
    }
    if (fresh) { pop.innerHTML = ""; pop.appendChild(fresh); }
  }

  /* Tap sur une planete / menace / quete de la carte -> pop-up missions. */
  document.addEventListener("click", function (ev) {
    if (!document.body || !document.body.classList.contains("stR2")) return;
    var t = ev.target;
    if (!t || !t.closest) return;
    if (t.closest("#st-r2-pop")) return;                      // clic dans le pop-up
    if (t.closest("#st-r2-nav")) { closePop(); return; }      // changement de page
    var hitMap = t.closest(".gwm-object,.gwm-cell,.gwm-badge,.gwm-ai-threat,.gwm-ai-boss,.gwm-name,.gwm-chip");
    if (hitMap) {
      popSource = ".layout>.side.right, .side.right";
      setTimeout(function () { adoptRightSide(); openPop(); }, 140);
      return;
    }
    var hitShip = t.closest(".arsenal-row:not(.header)");
    if (hitShip) {
      popSource = ".arsenal-detail";
      setTimeout(function () { adoptRightSide(); openPop(); }, 140);
    }
  }, true);
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closePop(); });

  /* Messagerie : tap sur un message -> le detail s ouvre en POP-UP au-dessus
     de la liste. Tap a cote -> ferme, la liste reste accessible pour ouvrir
     le message suivant. Aucune suppression necessaire. */
  document.addEventListener("click", function (ev) {
    if (!document.body || !document.body.classList.contains("stR2")) return;
    var t = ev.target;
    if (!t || !t.closest || !t.closest(".messages-list")) return;
    popSource = ".message-detail";
    setTimeout(function () { adoptRightSide(); openPop(); }, 140);
  }, true);

  function dockCarousel() {
    if (!document.body) return;
    var nav = document.getElementById("st-r2-nav");
    if (!nav) {
      nav = document.createElement("div");
      nav.id = "st-r2-nav";
      document.body.appendChild(nav);
    }
    var all = document.querySelectorAll(".carousel-container");
    var fresh = null;
    for (var i = 0; i < all.length; i++) {
      if (all[i].parentNode !== nav) fresh = all[i];
    }
    if (fresh) { nav.innerHTML = ""; nav.appendChild(fresh); }
  }

  function rotateOverlay() {
    if (!document.body || document.getElementById("st-r2-rotate")) return;
    var ov = document.createElement("div");
    ov.id = "st-r2-rotate";
    ov.innerHTML =
      '<div class="r2rot-card">' +
      '<div class="r2rot-title">STELLARION</div>' +
      '<div class="r2rot-ico">\uD83D\uDCF1\u2194\uFE0F</div>' +
      '<h2>Tourne ton t\u00e9l\u00e9phone</h2>' +
      '<p>Le jeu se joue en mode paysage sur mobile pour garder une interface lisible.</p>' +
      '</div>';
    document.body.appendChild(ov);
  }

  function badge() {
    if (!document.body || document.getElementById("st-r2-badge")) return;
    var b = document.createElement("button");
    b.id = "st-r2-badge";
    b.type = "button";
    b.title = "Boutique de fragments";
    b.innerHTML = "🛒 Boutique";
    b.addEventListener("click", function () {
      if (typeof window.openFragmentShop1546 === "function") window.openFragmentShop1546();
    });
    document.body.appendChild(b);
  }

  function apply() {
    ensureViewport();
    if (!phone()) {
      if (document.body) document.body.classList.remove("stR2", "stR2auth");
      return;
    }
    injectCss();
    if (!document.body) return;
    document.body.classList.add("stR2");
    var auth = authVisible();
    document.body.classList.toggle("stR2auth", auth);
    document.body.classList.toggle("stR2portrait", false); // portrait autorise (decision Vapowh)
    rotateOverlay();
    measureTop();
    menuButton();
    updateMenuBadge();
    killGhosts();
    dockCarousel();
    adoptRightSide();
    badge();
  }

  apply();
  document.addEventListener("DOMContentLoaded", apply);
  window.addEventListener("load", apply);
  window.addEventListener("resize", function () { setTimeout(apply, 60); }, { passive: true });
  window.addEventListener("orientationchange", function () { setTimeout(apply, 220); setTimeout(apply, 600); }, { passive: true });
  try { new MutationObserver(function () { apply(); }).observe(document.documentElement, { childList: true, subtree: true }); } catch (e) {}
  setInterval(apply, 700);

  window.stellarionMobileR2Audit = function () {
    return {
      patch: "mobile-R2.11-inline",
      actif: !!(document.body && document.body.classList.contains("stR2")),
      phone: phone(),
      portrait: isPortrait(),
      viewport: meta && meta.getAttribute("content"),
      innerW: innerWidth,
      innerH: innerHeight,
      topMesure: getComputedStyle(document.documentElement).getPropertyValue("--r2top").trim(),
      carrouselDocke: !!document.querySelector("#st-r2-nav .carousel-container"),
      menuOuvert: !!(document.body && document.body.classList.contains("stR2menu")),
      popupOuvert: !!(document.body && document.body.classList.contains("stR2pop")),
      authVisible: authVisible()
    };
  };
})();
</script>
